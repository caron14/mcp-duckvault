[project]
name = "mcp-duckvault"
version = "0.1.0"
description = "DuckVault-MCP: Obsidian-DuckDB RAG System with MCP Server"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.5.1",
    "mcp[cli]>=1.27.0",
    "pandas>=3.0.2",
    "pyyaml>=6.0.3",
    "sentence-transformers>=5.4.0",
    "watchdog>=6.0.0",
]

[project.scripts]
duckvault = "mcp_duckvault.cli:main"
