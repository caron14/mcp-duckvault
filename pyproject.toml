[project]
name = "mcp-duckvault"
version = "0.1.0"
description = "DuckVault-MCP: Obsidian-DuckDB RAG System with MCP Server"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
keywords = ["mcp", "obsidian", "duckdb", "rag", "vector-search"]
authors = [
    { name = "caron14", email = "caron14@users.noreply.github.com" }
]
dependencies = [
    "duckdb>=1.5.1",
    "mcp[cli]>=1.27.0",
    "pandas>=3.0.2",
    "pyyaml>=6.0.3",
    "sentence-transformers>=5.4.0",
    "watchdog>=6.0.0",
]

[project.urls]
Homepage = "https://github.com/caron14/mcp-duckvault"
Repository = "https://github.com/caron14/mcp-duckvault"
Issues = "https://github.com/caron14/mcp-duckvault/issues"

[project.scripts]
duckvault = "mcp_duckvault.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_duckvault"]
