[project]
name = "mcp-duckvault"
version = "0.4.0"
description = "DuckVault-MCP: local vector and visual graph RAG for Markdown and OKF"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["mcp", "obsidian", "duckdb", "rag", "vector-search"]
authors = [
    { name = "caron14", email = "caron14@users.noreply.github.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Text Processing :: Indexing",
]
dependencies = [
    "click>=8.0.0",
    "duckdb>=1.5.1",
    "filelock>=3.18.0",
    "mcp[cli]>=1.27.0,<2",
    "pyyaml>=6.0.3",
    "sentence-transformers>=5.4.0",
    "tqdm>=4.66.0",
    "watchdog>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "isort>=5.13.0",
    "pytest>=8.0.0",
    "pytest-timeout>=2.4.0",
]

[project.urls]
Homepage = "https://github.com/caron14/mcp-duckvault"
Repository = "https://github.com/caron14/mcp-duckvault"
Issues = "https://github.com/caron14/mcp-duckvault/issues"

[project.scripts]
duckvault = "mcp_duckvault.cli:main"

[tool.black]
line-length = 100
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
addopts = "-m 'not vss'"
markers = [
    "vss: requires downloading and loading the DuckDB VSS extension",
]
timeout = 60

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_duckvault"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/AGENTS.md",
    "/CLAUDE.md",
    "/IMPLEMENTATION_PLAN.md",
]
